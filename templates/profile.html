<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>Curtain</title>
    <link rel="stylesheet" href="static/general.css" />
    <script src="static/general.js "></script>
  </head>
  <body>
    <div w3-include-html="../items/navbar.html"></div>
    <div class="center base">
      <div class="top-down card center-rows">
        <h1>Hello {{username}}</h1>
        <p>Team: {{teamname}}</p>
        <form
          class="center-rows top-down space-between"
          style="gap: 10px"
          id="teamform"
          action="/api/create_team"
        >
          <input
            class="form-text"
            type="text"
            placeholder="teamname"
            name="teamname"
          />
          <div>
            <label for="createteam">create team instead</label>
            <input
              id="createteam"
              type="checkbox"
              name="createteam"
              value="createteam"
            />
          </div>
          <input class="login-button" type="submit" value="Join Team" />
        </form>
      </div>
    </div>
    <script>
      let teamform = document.getElementById("teamform");
      fetch("/api/get_user_details", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: '{"jwt": "' + jwt + '"}',
      })
        .then((response) => response.json())
        .then((data) => {
          let jsondata = JSON.parse(data);
          if (jsondata["status"] == "ok" && jsondata["teamid"] != "") {
            teamform.remove();
          } else {
          }
        })
        .catch((error) => {});

      const form = document.getElementById("teamform");
      let error = null;
      function add_error_message(message) {
        if (error == null) {
          error = document.createElement("span");
          form.appendChild(error);
        }
        error.innerHTML = message;
      }
      function submit_data(json) {
        const createteam = document.getElementById('createteam').checked;
        let dir = "/create_team";
        if (!createteam) {
          dir = "/join_team";
        }
        fetch(dir, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: json,
        })
          .then((response) => response.json())
          .then((data) => {
            let jsondata = JSON.parse(data);
            if (jsondata["status"] != "ok") {
              add_error_message(jsondata["status"]);
            } else {
              window.location.replace("/profile");
            }
          })
          .catch((error) => {
            add_error_message(JSON.parse(error)["status"]);
          });
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const data = new FormData(form);
        const form_object = form_data_to_object(data);
        form_object["jwt"] = get_cookies()["super_secret_dont_touch"];
        submit_data(JSON.stringify(form_object));
      });
    </script>
  </body>
</html>
