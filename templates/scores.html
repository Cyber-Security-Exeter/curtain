<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>Curtain</title>
    <link rel="stylesheet" href="static/general.css" />
    <script src="static/general.js "></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
  </head>
  <body>
    <div w3-include-html="/items/navbar.html"></div>
    <div class="bar-chart-holder">
      <div class="top-down card">
        <canvas id="scorechart" style="width: 100vw; height: 60vh;"></canvas>
        <h1>Leaderboard</h1>
        {% for team in teams %}
          <div class="center-left-right">
            <h3>{{loop.index}}. Team {{team.name}}: {{team.points}}</h3>
          </div>
        {% endfor %}
      </div>
    </div>
    <script>
        const teams = [
          {% for team in teams %}
            "{{team.name}}",
          {% endfor %}
        ];
        const scores = [
          {% for team in teams %}
            "{{team.points}}",
          {% endfor %}
        ];
        const barColors = [];
        const scorechart = new Chart("scorechart", {
            type: "bar",
            data: {
                labels: teams,
                datasets: [{ 
                    label: "points",
                    data: scores
                }]
            },
            options: {}
        });
    </script>
  </body>
</html>
