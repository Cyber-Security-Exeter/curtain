<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>Curtain</title>
    <link rel="stylesheet" href="/static/general.css" />
    <script src="/static/general.js "></script>
  </head>
  <body>
    <div w3-include-html="/items/navbar.html"></div>
    <div class="center base">
      <div class="top-down card center-rows">
        <h1>Hello {{username}}</h1>
        <form
          class="center-rows top-down space-between"
          style="gap: 10px"
          id="challengeform"
          action="/create_challenge"
        >
          <input
            class="form-text"
            type="text"
            placeholder="challenge name"
            name="name"
          />
          <input
            class="form-text"
            type="text"
            placeholder="100"
            name="points"
          />
          <input
            class="form-text"
            type="text"
            placeholder="description"
            name="description"
          />
          <input
            class="form-text"
            type="text"
            placeholder="challenge id"
            name="challengeid"
          />
          <input
            class="form-text"
            type="text"
            placeholder="flag{}"
            name="flag"
          />
          <input
            class="form-text"
            type="text"
            placeholder="file.txt,file2.txt"
            name="linkedfiles"
          />
          <input class="login-button" type="submit" value="Create challenge" />
        </form>
      </div>
    </div>
    <script>
      const form = document.getElementById("challengeform");
      let error = null;
      function add_error_message(message) {
        if (error == null) {
          error = document.createElement("span");
          form.appendChild(error);
        }
        error.innerHTML = message;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const data = new FormData(form);
        const form_object = form_data_to_object(data);
        form_object["jwt"] = get_cookies()["super_secret_dont_touch"];
        let jsondata = await submit_data(JSON.stringify(form_object), "/api/create_challenge");
        if (jsondata["status"] != "ok") {
          add_error_message(jsondata["status"]);
        } else {
          window.location.replace("/admin/create_challenge");
        }
      });
    </script>
  </body>
</html>
