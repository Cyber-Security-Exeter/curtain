[package]
name = "curtain"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.9"
axum-extra = "0.12.6"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = "0.39.0"
uuid = { version = "1.24.0", features = ["v4"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
tokio-util = "0.7.8"
tower = "0.5.3"
tower-http = { version = "0.7", features = ["fs"] }
askama = "0.16.0"
axum-cookie = "0.3.0"
serde_json = "1.0.151"
axum-client-ip = "1.3.1"
md5 = "0.8.1"
sha256 = "1.6.0"
